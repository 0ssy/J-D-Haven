<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J&D Haven - Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="admin-page">
    <div id="loginView" class="admin-panel">
      <h2>Admin Login</h2>
      <div class="admin-form-grid">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email" required pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" title="Enter a valid email address">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn" class="btn btn-primary">Log In</button>
      </div>
    </div>

    <div id="adminView" class="admin-panel" style="display:none;">
      <div class="admin-topbar">
        <p class="admin-subtitle">Manage storefront products and customer orders.</p>
        <button id="logoutBtn" class="btn btn-outline" type="button">Log Out</button>
      </div>

      <h2>Products</h2>
      <div id="productForm" class="admin-form-grid">
        <input type="text" id="pName" placeholder="Product name">
        <textarea id="pDesc" placeholder="Description"></textarea>
        <input type="number" id="pPrice" placeholder="Price">
        <select id="pCategory" title="Category">
          <option value="">Select category</option>
        </select>
        <label class="admin-checkbox">
          <input type="checkbox" id="pInStock" checked>
          <span>In stock / available to order</span>
        </label>
        <input type="number" id="pLeadTimeDays" min="1" placeholder="Lead time in days (optional)">
        <input type="file" id="pImage" accept="image/*">
        <button id="addProductBtn" class="btn btn-primary">Add Product</button>
      </div>
      <div id="productsList"></div>

      <h2>Orders</h2>
      <div class="admin-order-controls">
        <input type="search" id="orderSearch" placeholder="Search by name or email">
        <select id="orderStatusFilter" title="Filter orders by status">
          <option value="fresh" selected>Fresh orders</option>
          <option value="all">All statuses</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="in_production">In production</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
        </select>
      </div>
      <div id="ordersList"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
